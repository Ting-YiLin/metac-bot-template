name: FutureEval Live Free Production

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/run_live_free.yaml'
  workflow_dispatch:
  schedule:
    - cron: '17 0-22/2 * * *'
    - cron: '57 0-22/2 * * *'
    - cron: '37 1-23/2 * * *'

permissions:
  contents: read

concurrency:
  group: futureeval-live-free-production
  cancel-in-progress: false

jobs:
  forecast_batch:
    runs-on: ubuntu-latest
    timeout-minutes: 38
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.0
        with:
          version: '0.13.1'
      - name: Install locked forecasting dependencies
        run: uv sync --locked --no-dev
      - name: Install free web research runtime
        run: python -m pip install -r web_research_stack/requirements-runtime.txt
      - name: Forecast open unforecasted questions continuously
        env:
          GITHUB_ACTIONS: 'true'
          LIVE_FREE_MODEL: 'openrouter/free'
          LIVE_FREE_MAX_RUN_SECONDS: '1920'
          METACULUS_TOKEN: ${{ secrets.METACULUS_TOKEN }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: uv run python live_free_runner.py
      - name: Retain receipts and evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: futureeval-live-free-batch-${{ github.run_id }}
          path: |
            live_free_receipt.json
            web_research_stack/runs/forecast_*
          if-no-files-found: warn
          retention-days: 7
