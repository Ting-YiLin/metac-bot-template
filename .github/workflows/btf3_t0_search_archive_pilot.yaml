name: BTF3 T0-Safe Search + Archive Pilot

on:
  push:
    branches:
      - btf3-crawler-smoke-20261103
    paths:
      - 'web_research_stack/src/route_quality.py'
      - 'web_research_stack/src/ranker.py'
      - 'web_research_stack/src/crawler.py'
      - 'web_research_stack/src/wayback.py'
      - 'web_research_stack/src/btf3_t0_search_pilot.py'
      - 'web_research_stack/data/btf3_pilot10_cases.json'
      - 'web_research_stack/tests/test_route_quality.py'
      - 'web_research_stack/tests/test_wayback.py'
      - '.github/workflows/btf3_t0_search_archive_pilot.yaml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: btf3-t0-safe-pilot
  cancel-in-progress: true

jobs:
  pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install free research dependencies
        run: python -m pip install -r web_research_stack/requirements-runtime.txt
      - name: Route-quality and T0 archive unit tests
        run: |
          PYTHONPATH=web_research_stack/src python -m unittest -v             web_research_stack.tests.test_stack             web_research_stack.tests.test_btf3_adaptation             web_research_stack.tests.test_route_quality             web_research_stack.tests.test_wayback
      - name: Run same 10-question T0-safe search/archive pilot
        working-directory: web_research_stack
        run: |
          PYTHONPATH=src python src/btf3_t0_search_pilot.py             --cases data/btf3_pilot10_cases.json             --out-dir runs/btf3_t0_pilot10             --archive-candidates 4             --target-archives 2
      - name: Upload T0-safe pilot evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: btf3-t0-safe-pilot10
          path: web_research_stack/runs/btf3_t0_pilot10
          if-no-files-found: warn
          retention-days: 14
