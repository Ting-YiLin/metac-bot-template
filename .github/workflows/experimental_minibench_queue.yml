name: MiniBench Work Queue Validation Only (Experimental)

on:
  push:
    branches:
      - experiment/work-luna-sol-minibench-20261117
    paths:
      - '.github/workflows/experimental_minibench_queue.yml'
      - 'experimental_minibench_work/queue_dryrun.py'
      - 'experimental_minibench_work/tests/test_queue_dryrun.py'
      - 'experimental_minibench_work/pending/q-*.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: minibench-work-queue-experimental
  cancel-in-progress: false

jobs:
  validate_work_forecasts:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Offline validator and queue tests
        run: |
          python -m unittest discover -s experimental_minibench_work/tests -p 'test_validate_dryrun.py' -v
          python -m unittest discover -s experimental_minibench_work/tests -p 'test_queue_dryrun.py' -v
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          version: '0.13.1'
      - name: Install locked official Metaculus dependency
        run: uv sync --locked --no-dev
      - name: Validate Work queue against fresh authenticated MiniBench state (no POST)
        env:
          METACULUS_TOKEN: ${{ secrets.METACULUS_TOKEN }}
        run: uv run python experimental_minibench_work/queue_dryrun.py
      - name: Save validation outcome
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: minibench-work-queue-${{ github.run_id }}
          path: minibench_work_queue_receipt.json
          if-no-files-found: warn
          retention-days: 7
