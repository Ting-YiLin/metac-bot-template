name: FutureEval V2.3 - 600s HIGH Full-System Practice (NO SUBMISSION)
on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'offline-test -> fetch-only -> diagnostic -> full-system (5 questions in one run)'
        type: choice
        required: true
        default: offline-test
        options: [offline-test, fetch-only, research-only, diagnostic, live-practice, full-system]
      question_count:
        description: 'Select 5 for full-system: connectivity + optional router probe + five questions'
        type: choice
        required: true
        default: '2'
        options: ['2', '5']
      dataset:
        description: 'Previous authorized five testing-area questions, or authorized-live'
        type: choice
        required: true
        default: previous-five
        options: [previous-five, authorized-live]
      free_tier_confirmed:
        description: 'YES only if Google project billing still OFF and free-tier valid'
        type: choice
        required: true
        default: 'no'
        options: ['no', 'yes']
      data_permission_confirmed:
        description: 'YES only if authorized to process the test-area question content'
        type: choice
        required: true
        default: 'no'
        options: ['no', 'yes']
      free_router_fallback_authorized:
        description: 'YES only if OPENROUTER_API_KEY is present and only openrouter/free is allowed'
        type: choice
        required: true
        default: 'no'
        options: ['no', 'yes']
      already_used_lite:
        description: 'Actual Google AI Studio DAILY used requests for Gemini 3.5 Lite'
        required: true
        default: NOT_CHECKED
        type: string
      already_used_38:
        description: 'Actual Google AI Studio DAILY used requests for Gemini 3.8'
        required: true
        default: NOT_CHECKED
        type: string
      already_used_36:
        description: 'Actual Google AI Studio DAILY used requests for Gemini 3.6'
        required: true
        default: NOT_CHECKED
        type: string
      already_used_openrouter:
        description: 'OpenRouter free daily attempts; read Activity first, else NOT_CHECKED disables fallback'
        required: true
        default: NOT_CHECKED
        type: string
permissions:
  contents: read
concurrency:
  group: futureeval-v22-practice-only-single-run
  cancel-in-progress: false
jobs:
  practice_only:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - name: Checkout reviewed fork
        uses: actions/checkout@v4
      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: uv official pinned environment
        uses: astral-sh/setup-uv@v10.3.0
        with:
          version: '0.13.1'
      - name: Fail-closed safety gates and offline tests BEFORE dependency install
        run: |
          python tools/s0_safety_gate.py --repo .
          python tools/v2_safety_gate.py --repo .
          python -m unittest discover -s tests -v
      - name: Install locked official dependencies
        run: uv sync --locked --no-dev
      - name: Run read-only practice (never submit)
        env:
          METACULUS_TOKEN: ${{ secrets.METACULUS_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          MODE: ${{ inputs.mode }}
          DATASET: ${{ inputs.dataset }}
          QCOUNT: ${{ inputs.question_count }}
          V21_FREE_TIER_CONFIRMED: ${{ inputs.free_tier_confirmed == 'yes' && 'YES' || 'NO' }}
          V21_AUTHORIZED_METACULUS_DATA_USE: ${{ inputs.data_permission_confirmed == 'yes' && 'YES' || 'NO' }}
          V22_OPENROUTER_FREE_AUTHORIZED: ${{ inputs.free_router_fallback_authorized == 'yes' && 'YES' || 'NO' }}
          V21_ALREADY_USED_LITE: ${{ inputs.already_used_lite }}
          V21_ALREADY_USED_38: ${{ inputs.already_used_38 }}
          V21_ALREADY_USED_36: ${{ inputs.already_used_36 }}
          V22_ALREADY_USED_OPENROUTER: ${{ inputs.already_used_openrouter }}
        run: |
          case "$MODE" in offline-test|fetch-only|research-only|diagnostic|live-practice|full-system) ;; *) exit 2;; esac
          case "$DATASET" in previous-five|authorized-live) ;; *) exit 2;; esac
          case "$QCOUNT" in 2|5) ;; *) exit 2;; esac
          if [ "$MODE" = "full-system" ] && [ "$QCOUNT" != "5" ]; then echo 'full-system requires 5 questions'; exit 5; fi
          uv run python -m practice.run --mode "$MODE" --dataset "$DATASET" --max-questions "$QCOUNT"
      - name: Persist evidence even if partial or errors
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: futureeval-v22-high-thinking-practice-no-submit
          path: |
            OUTPUT/SELECTED_QUESTIONS.json
            OUTPUT/STATUS.json
            OUTPUT/SUMMARY.json
            OUTPUT/DIAGNOSTIC.json
            OUTPUT/SYSTEM_RELIABILITY.json
            OUTPUT/QUESTION_REPORTS/*.json
            OUTPUT/usage_ledger.json
            v2_preflight.json
            s0_preflight.json
          if-no-files-found: warn
          retention-days: 14
