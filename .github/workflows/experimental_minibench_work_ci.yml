name: Work MiniBench Experimental Dry-Run Validation

on:
  push:
    branches:
      - experiment/work-luna-sol-minibench-20261117
    paths:
      - 'experimental_minibench_work/**'
      - '.github/workflows/experimental_minibench_work_ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline_validation:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          version: '0.13.1'
      - name: Install locked platform models and encryption
        run: |
          uv sync --locked --no-dev
          uv pip install --python .venv/bin/python 'cryptography>=45,<47'
      - name: Run complete offline all-types and legacy regression suite
        run: uv run --no-sync python -m unittest discover -s experimental_minibench_work/tests -v
