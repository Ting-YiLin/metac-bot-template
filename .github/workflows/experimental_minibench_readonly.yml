name: MiniBench Authenticated Read-only Probe (Experimental)

on:
  push:
    branches:
      - experiment/work-luna-sol-minibench-20261117
    paths:
      - '.github/workflows/experimental_minibench_readonly.yml'
      - 'experimental_minibench_work/minibench_readonly_probe.py'
      - 'experimental_minibench_work/tests/test_minibench_readonly_probe.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: minibench-readonly-probe-experimental
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          version: '0.13.1'
      - name: Offline read-only probe tests (no credentials)
        run: python -m unittest discover -s experimental_minibench_work/tests -p 'test_minibench_readonly_probe.py' -v
      - name: Install locked Metaculus dependency
        run: uv sync --locked --no-dev
      - name: Authenticated MiniBench read-only scan (no posting)
        env:
          METACULUS_TOKEN: ${{ secrets.METACULUS_TOKEN }}
        run: uv run python experimental_minibench_work/minibench_readonly_probe.py
      - name: Store evidence from this run only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: minibench-readonly-${{ github.run_id }}
          path: |
            minibench_readonly_probe_receipt.json
            minibench_readonly_candidate_feed.json
          if-no-files-found: warn
          retention-days: 7
