name: MiniBench Authenticated Read-only Probe (Experimental)

on:
  push:
    branches:
      - experiment/work-luna-sol-minibench-20261117
    paths:
      - '.github/workflows/experimental_minibench_readonly.yml'
      - 'experimental_minibench_work/minibench_readonly_probe.py'
      - 'experimental_minibench_work/publish_snapshot.py'
      - 'experimental_minibench_work/tests/test_minibench_readonly_probe.py'
      - 'experimental_minibench_work/tests/test_publish_snapshot.py'
      - 'experimental_minibench_work/refresh_protocol.py'
      - 'experimental_minibench_work/tests/test_refresh_protocol.py'
      - 'experimental_minibench_work/refresh_requests/req-*.json'
  workflow_dispatch:

permissions:
  contents: write # isolated state branch snapshot only; no Metaculus writes

concurrency:
  group: minibench-readonly-probe-experimental
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          version: '0.13.1'
      - name: Offline probe and publisher tests (no credentials)
        run: |
          python -m unittest discover -s experimental_minibench_work/tests -p 'test_minibench_readonly_probe.py' -v
          python -m unittest discover -s experimental_minibench_work/tests -p 'test_publish_snapshot.py' -v
          python -m unittest discover -s experimental_minibench_work/tests -p 'test_refresh_protocol.py' -v
      - name: Validate optional Work refresh request before touching credentials
        run: |
          python -c "import sys; sys.path.insert(0, 'experimental_minibench_work'); from refresh_protocol import request_id_from_push; print('REFRESH_REQUEST_VALID' if request_id_from_push() else 'NO_REFRESH_REQUEST')"
      - name: Install locked Metaculus dependency
        run: uv sync --locked --no-dev
      - name: Authenticated MiniBench read-only scan (no posting)
        env:
          METACULUS_TOKEN: ${{ secrets.METACULUS_TOKEN }}
        run: uv run python experimental_minibench_work/minibench_readonly_probe.py
      - name: Publish sanitized fresh feed to isolated state branch
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: uv run python experimental_minibench_work/publish_snapshot.py
      - name: Store evidence from this run only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: minibench-readonly-${{ github.run_id }}
          path: |
            minibench_readonly_probe_receipt.json
            minibench_readonly_candidate_feed.json
            minibench_feed_publish_receipt.json
          if-no-files-found: warn
          retention-days: 7
