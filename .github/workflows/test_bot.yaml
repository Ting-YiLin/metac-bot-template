name: Test Bot
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: futureeval-s0-single-test
  cancel-in-progress: false
jobs:
  one_question_only:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out approved code
        uses: actions/checkout@v4
      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.0
        with:
          version: '0.13.1'
      - name: Safe static gate BEFORE dependency installation
        run: python tools/s0_safety_gate.py --repo .
      - name: Install exactly locked official dependencies
        run: uv sync --locked --no-dev
      - name: Submit one binary TEST AREA forecast using free route only
        env:
          GITHUB_ACTIONS: 'true'
          S0_TEST_ONLY: '1'
          S0_FREE_MODEL: 'openrouter/free'
          METACULUS_TOKEN: ${{ secrets.METACULUS_TOKEN }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: uv run python s0_one_test.py
      - name: Retain sanitized result candidate
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: futureeval-s0-one-test-sanitized
          path: |
            s0_receipt_candidate.json
            s0_preflight.json
          if-no-files-found: warn
          retention-days: 7
